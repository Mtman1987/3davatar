name: Validate and package AvatarAce integrated candidate

on:
  push:
    branches:
      - work/avatarace-complete-before-test
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out integrated candidate
        uses: actions/checkout@v4

      - name: Verify required models and commissioned asset identity
        shell: bash
        run: |
          set -euo pipefail
          test -s public/models/male-base-mesh-base_male.glb
          test -s public/models/female-base-mesh-base_female.glb
          test -s public/models/neon-gamer-facial-v2.glb
          actual="$(sha256sum public/models/neon-gamer-facial-v2.glb | cut -d' ' -f1)"
          expected="ab8684c30f9fc5110a38b73a9ed88ebac373d635867ae0b2f03a45f6d51028ba"
          test "$actual" = "$expected" || { echo "::error::Commissioned GLB identity mismatch: $actual"; exit 1; }
          echo "Verified commissioned model SHA-256: $actual"

      - name: Validate Python reconstruction service and pipeline syntax
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile reconstruction service and pipeline
        run: |
          python -m compileall -q face-reconstruction-service src scripts/run_pipeline.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run repository-wide tests (known unrelated failures are non-blocking for AvatarAce)
        continue-on-error: true
        run: npm test

      - name: Production build
        run: npm run build

      - name: Package source for device testing
        shell: bash
        run: |
          set -euo pipefail
          # Archive tracked files only; this avoids accidentally including the ZIP in itself.
          git archive --format=zip --output=AvatarAce-integrated-candidate.zip HEAD
          test -s AvatarAce-integrated-candidate.zip
          unzip -t AvatarAce-integrated-candidate.zip
          unzip -Z1 AvatarAce-integrated-candidate.zip | grep -Fx "public/models/neon-gamer-facial-v2.glb"
          unzip -Z1 AvatarAce-integrated-candidate.zip | grep -Fx "public/models/male-base-mesh-base_male.glb"
          unzip -Z1 AvatarAce-integrated-candidate.zip | grep -Fx "public/models/female-base-mesh-base_female.glb"
          if unzip -Z1 AvatarAce-integrated-candidate.zip | grep -E '^(HeadlessBody[.]glb|Meshy_AI_.*[.]glb|neon-gamer-facial-v2[.]glb)$'; then
            echo "::error::A root-level duplicate GLB was included in the package."
            exit 1
          fi

      - name: Upload integrated candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: AvatarAce-integrated-candidate
          path: AvatarAce-integrated-candidate.zip
          if-no-files-found: error
          retention-days: 14
