name: Validate and package updated Grok workspace

on:
  pull_request:
    paths:
      - ".patches/avatar-model-loader.patch"
      - ".github/workflows/build-updated-workspace.yml"
      - "grok-workspace.zip"
  push:
    branches: [main]
    paths:
      - ".patches/avatar-model-loader.patch"
      - ".github/workflows/build-updated-workspace.yml"
      - "grok-workspace.zip"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-workspace:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .node-workspace-cache-key

      - name: Extract workspace
        run: |
          test -s grok-workspace.zip
          mkdir workspace
          unzip -q grok-workspace.zip -d workspace
          test -s workspace/package.json

      - name: Apply viewer model-loader changes
        run: patch --batch --forward -p1 -d workspace < .patches/avatar-model-loader.patch

      - name: Install workspace dependencies
        working-directory: workspace
        run: npm ci --no-audit --no-fund

      - name: Type-check workspace
        working-directory: workspace
        run: npm run typecheck

      - name: Run workspace tests
        working-directory: workspace
        run: npm test

      - name: Package updated workspace
        run: |
          rm -rf workspace/node_modules workspace/.git
          cd workspace
          zip -qr ../grok-workspace-updated.zip .

      - name: Upload updated workspace ZIP
        uses: actions/upload-artifact@v4
        with:
          name: grok-workspace-updated
          path: grok-workspace-updated.zip
          if-no-files-found: error
          retention-days: 30
