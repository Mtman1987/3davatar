name: Inspect AvatarAce face workflow source
on:
  push:
    branches:
      - inspect-avatarace-face-source
    paths:
      - .github/workflows/inspect-avatarace-source.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract source archive
        run: unzip -q grok-workspace.zip -d recovered-workspace
      - name: Locate face-generation code
        shell: bash
        run: |
          set -euo pipefail
          echo '=== FACE FILES ==='
          find recovered-workspace/src -type f | grep -Ei 'face|avatar|studio' | sort | head -100
          echo '=== FACE CACHE / GENERATION REFERENCES ==='
          grep -R -nE 'getFaceCache|generateFace|FacePanel|faceChoice|makeFace' recovered-workspace/src/components/studio recovered-workspace/src/lib/avatar | head -160
      - name: Print face builder and cache contracts
        shell: bash
        run: |
          set -euo pipefail
          for FILE in recovered-workspace/src/lib/avatar/build-face.ts recovered-workspace/src/lib/avatar/face-cache.ts recovered-workspace/src/lib/avatar/store.ts recovered-workspace/src/lib/avatar/arkit.ts recovered-workspace/src/lib/avatar/constants.ts recovered-workspace/src/lib/avatar/detect.ts; do
            echo "=== $FILE ==="
            sed -n '1,420p' "$FILE"
          done
          echo '=== Studio face generation handlers ==='
          sed -n '1,260p' recovered-workspace/src/components/studio/StudioApp.tsx
      - name: Upload original face-generation modules
        uses: actions/upload-artifact@v4
        with:
          name: avatarace-face-source
          path: |
            recovered-workspace/src/lib/avatar/build-face.ts
            recovered-workspace/src/lib/avatar/face-cache.ts
            recovered-workspace/src/lib/avatar/detect.ts
            recovered-workspace/src/lib/avatar/arkit.ts
            recovered-workspace/src/components/studio/Viewport.tsx
          retention-days: 1
